name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Clone Sushi Kernel Sources
        run: |
          git clone --depth=1 https://github.com/SushiKernel/android_kernel_motorola_fogos -b dezesseis-qpr2 kernel

      - name: Setup Environment and Compile
        run: |
          echo "Iniciando preparacao da compilacao do Sushi Kernel para fogos..."
          cd kernel
          make defconfig fogos_defconfig
          echo "Configuracao aplicada com sucesso!"
