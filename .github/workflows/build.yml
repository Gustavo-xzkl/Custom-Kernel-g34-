name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build Android Kernel
        uses: dabao1955/android-kernel-build-action@v1.10.2
        with:
          kernel-source: 'https://github.com/SushiKernel/android_kernel_motorola_fogos'
          kernel-branch: 'dezesseis-qpr2'
          config-file: 'fogos_defconfig'
          arch: 'arm64'
          compiler: 'clang'
