name: Compilar Sushi Kernel G34

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar Código-Fonte do Sushi Kernel
        run: |
          git clone --depth=1 https://github.com/SushiKernel/android_kernel_motorola_fogos kernel_workspace

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev bc git

      - name: Procurar Arquivos de Configuração
        run: |
          cd kernel_workspace
          echo "Procurando arquivos de config do fogos..."
          find arch/arm64/configs -name "*fogos*" -o -name "*g34*"
